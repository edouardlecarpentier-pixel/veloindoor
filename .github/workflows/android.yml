name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dependances
        run: npm install

      - name: Preparer le dossier web
        run: node scripts/prepare-android.mjs

      - name: Creer le projet Android
        run: npx cap add android

      - name: Ajuster permissions et ecran
        run: node scripts/patch-android.mjs

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK (release "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk veloindoor.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest veloindoor.apk --title "VeloIndoor (derniere version)" --notes "APK de test (debug). Telecharge veloindoor.apk et installe-le sur Android."
