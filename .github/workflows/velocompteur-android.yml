name: Build VéloCompteur APK

on:
  push:
    branches: [main]
    paths:
      - 'velocompteur/**'
      - 'velocompteur-app/**'
      - '.github/workflows/velocompteur-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: velocompteur-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dependances
        run: npm install

      - name: Preparer le dossier web
        run: node scripts/prepare.mjs

      - name: Creer le projet Android
        run: npx cap add android

      - name: Ajuster permissions et ecran
        run: node scripts/patch-android.mjs

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Cle de signature fixe (mises a jour sans desinstaller)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore

      - name: Compiler l'APK
        working-directory: velocompteur-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK (release "velocompteur-latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk velocompteur.apk
          gh release delete velocompteur-latest --yes --cleanup-tag || true
          gh release create velocompteur-latest velocompteur.apk --title "VéloCompteur (dernière version)" --notes "APK de test (debug). Télécharge velocompteur.apk et installe-le sur Android."
